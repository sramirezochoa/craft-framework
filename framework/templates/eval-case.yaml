# Eval case template
#
# For non-deterministic behaviour — anything a model decides. Not only
# chatbots: classifiers, extractors, RAG answers, routing and tool-calling
# agents all belong here. The dividing line is whether the same input always
# produces the same output. If it does, write an ordinary test instead.
#
# Assert on PROPERTIES, never on exact output strings — exact-match assertions
# on model output are brittle, and the next person deletes them, which defeats
# the purpose.
#
# File: evals/<capability>/<AC-id>-<slug>.yaml

id: AC-3-cancel-after-ship-confirmation
capability: order-cancellation
criterion: AC-3
change: 012
kind: conversation          # conversation | single-turn | tool-use
tags: [happy-path]          # happy-path | edge-case | guardrail | regression

description: >
  When the user asks to cancel a shipped order inside the 24h window, the
  assistant confirms the request and states the refund timeline.

# Fixed context the run starts from. Keep it minimal.
setup:
  fixtures:
    - orders/shipped-2h-ago.json
  user_profile:
    locale: en-US

# --- the input: use EITHER `turns` or `input`, not both -------------------

# Conversational — a scripted exchange, one entry per user message.
turns:
  - user: "I want to cancel my order, it already shipped yesterday"

# Single-shot — one payload in, one response out. Use this for classifiers,
# extractors, summarisers and any endpoint that is not a dialogue. A string
# or a structured object both work:
#
#   input: "Printer jams on duplex. Third time this week."
#
#   input:
#     ticket_id: T-4471
#     body: "Printer jams on duplex. Third time this week."
#     channel: email

# --- what must be true ----------------------------------------------------
# Each assertion should survive a reasonable rewording of the output.

expect:
  tool_calls:
    - name: cancel_order
      with:
        order_id: "ORD-1001"
  contains_information:
    - refund timeline is stated
    - cancellation is confirmed
  must_not:
    - invent a refund amount
    - promise a delivery date
    - disclose internal system names
  output_schema: schemas/cancellation-response.json   # optional
  max_turns: 3

# `tool_calls`, `output_schema`, `max_turns`, `max_tool_calls` and regex-style
# `must_not` are checked mechanically. `contains_information` and prose
# `must_not` need the `judge()` hook in evals/run.py; without it they are
# reported as UNJUDGED rather than quietly passing.
#
# Guardrails that apply to every case in the suite live in evals/defaults.yaml
# instead of being repeated here.
